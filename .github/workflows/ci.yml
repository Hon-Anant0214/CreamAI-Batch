
name: GATENavigator CI

on:
  push:
    branches:
      - main
      - feature/day12-ci
  pull_request:
    branches:
      - main

jobs:
  quality-and-tests:
    name: Ruff and Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GateNavigator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: GateNavigator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run Pytest
        run: python -m pytest -q

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gatenavigator:ci ./GateNavigator
